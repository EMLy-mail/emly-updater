[updater]
; Cartella di installazione di EMLy. Usata per individuare l'eseguibile
; e per riparare le associazioni file dopo un aggiornamento.
emlyInstallDir       = C:\3gIT\EMLy

; Nome dell'eseguibile di EMLy. Usato per verificare se EMLy è in esecuzione
; e, se necessario, terminarlo prima di applicare un aggiornamento forzato.
emlyExeName          = EMLy.exe

; Percorso del file config.ini di EMLy. L'updater lo legge per conoscere
; la versione installata, il canale di aggiornamento e la lingua dell'interfaccia.
emlyConfigFile       = C:\3gIT\EMLy\config.ini

; Intervallo di controllo aggiornamenti, espresso in minuti (minimo 1).
; Ogni ciclo l'updater scarica il manifest e confronta la versione disponibile
; con quella installata.
pollIntervalMinutes  = 15

; Forza il canale di aggiornamento indipendentemente da quello impostato in EMLy.
; Lasciare vuoto per seguire GUI_RELEASE_CHANNEL dal config.ini di EMLy.
; Valori ammessi: vuoto, "stable", "beta".
channelOverride      =

[source]
; Sorgente primaria per il manifest degli aggiornamenti.
; "external" = HTTPS pubblico (API EMLy su Internet).
; "internal" = HTTP su rete locale (server interno).
; Se la sorgente primaria non risponde, l'updater riprova con backoff
; esponenziale (3 tentativi) prima di rinunciare al ciclo corrente.
primary              = internal

; URL del manifest usato quando primary = external.
externalManifestURL  = https://api.emly.ffois.it/v2/updates/manifest

; URL del manifest usato quando primary = internal.
; Obbligatorio solo se primary = internal; lasciare vuoto altrimenti.
internalManifestURL  = http://172.16.33.72:8080/v2/updates/manifest

; User-Agent inviato nelle richieste HTTP verso il manifest e il download.
; Identifica il client presso le API EMLy. Il segnaposto {{VERSION}} viene
; sostituito a runtime con la versione dell'updater in esecuzione: va lasciato
; com'è, altrimenti la versione dichiarata alle API resta ferma a quella con
; cui la macchina è stata installata la prima volta.
userAgent            = EMLy-Updater/{{VERSION}} (f.fois@3git.eu)

; Chiave API inviata come header X-Api-Key nelle richieste HTTP.
; Lasciare vuoto se non richiesta dal server.
xApiKey              = emly_1BaQdBknsMGcY5DynSby71JnWOKXtJvnuUprkgWT0pujpLFxj5HaTXP9vtJAMk63

; Mappa sede -> subnet interne, per riconoscere qualunque sede aziendale.
; All'avvio l'updater rileva il domain controller più vicino: se il suo nome
; compare qui e almeno un IP locale della macchina ricade in una delle subnet
; CIDR elencate per quel DC, la macchina è in sede e primary viene forzato a
; "internal"; in ogni altro caso (DC non mappato, nessun IP locale nelle
; subnet indicate, macchina fuori dominio) viene forzato a "external" e il
; valore viene riscritto qui.
; Formato: "<DC>:<cidr>[,<cidr>...][;<DC>:<cidr>[,<cidr>...]...]".
; Il confronto sul nome del DC ignora maiuscole e suffisso DNS: "DC-RM2"
; combacia anche con "DC-RM2.tregcc.local". Lasciare vuoto per disattivare
; il controllo.
defaultMappingDCSubnets = DC-RM2:172.16.96.0/24,10.12.8.0/24;DC-CB:172.16.33.0/24,172.16.34.0/24,172.16.35.0/24

[selfUpdate]
; Abilita l'aggiornamento automatico dell'updater stesso. A ogni ciclo il
; servizio interroga il manifest della propria versione: se ne trova una più
; recente scarica il setup, ne verifica SHA256 e firma digitale, lo avvia in
; modo silenzioso e si lascia riavviare da esso. Il config.ini viene
; riscritto dai default della nuova versione (il file precedente viene
; salvato come config.prev.ini).
enabled = true

; URL del manifest dell'updater. Lasciare vuoto per derivarlo dal manifest
; in uso, aggiungendo il segmento "updater" al suo percorso: ad esempio
; ".../v2/updates/manifest" diventa ".../v2/updates/manifest/updater".
; Valorizzarlo solo per puntare a un host diverso da quello del manifest di
; EMLy; in tal caso vale per ogni sorgente, senza fallback.
manifestURL =

[fileAssociations]
; ProgID registrato nel registro di Windows per i file .eml gestiti da EMLy.
progIdEml = EMLy.EML

; ProgID registrato nel registro di Windows per i file .msg gestiti da EMLy.
progIdMsg = EMLy.MSG

[criticalUpdate]
; Abilita la finestra di avviso mostrata agli utenti prima di terminare EMLy
; in caso di aggiornamento forzato (forced = true nel manifest).
criticalWarningEnabled = true

; Secondi di attesa dopo la chiusura della finestra di avviso, prima di
; terminare il processo EMLy e avviare l'installazione.
criticalWarningSeconds = 30

[ipc]
; Abilita il server IPC (named pipe) che espone SystemInfo/ADStatus a EMLy.
enabled = true

; Nome della named pipe (esposta come \\.\pipe\<nome>). Non deve contenere
; '\' o '/'.
pipeName = EMLyUpdater

[certificate]
; Installa il certificato di code-signing 3gIT negli store Root e
; TrustedPublisher, sia a livello di macchina sia per l'utente della
; sessione console attiva. Serve a far sì che EMLy e il suo setup
; risultino firmati da un editore verificato invece che da "Autore
; sconosciuto" nel prompt UAC.
; Il controllo viene rieseguito a ogni ciclo di polling ed è idempotente.
enabled = true
