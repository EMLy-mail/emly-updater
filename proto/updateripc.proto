syntax = "proto3";

package emly.updateripc.v1;

// go_package is a placeholder: each repo generates into its own local
// package directory independently (paths=source_relative), so this does not
// need to resolve to a real cross-repo import path.
option go_package = "emlyipc/ipcpb;ipcpb";

// THIS FILE IS MANUALLY SYNCED between emly-updater/proto/updateripc.proto
// and emly/proto/updateripc.proto. There is no shared Go module between the
// two repos. Any change here MUST be copied verbatim to the other repo and
// both sides' generated code regenerated. Bump PROTOCOL_VERSION (a Go const
// in each repo, not a field in this file) on any wire-incompatible change.
//
// Compatibility matrix — which EMLyUpdater / EMLy releases speak which
// protocol_version. Both sides carry their own semver in sender_version
// (below) and enforce the *min* column of their own repo's compatibility
// consts (internal/ipc/version.go server-side, backend/utils/updateripc's
// version.go client-side) — a peer older than the min is rejected with
// ERROR_CODE_UNSUPPORTED_VERSION even when protocol_version matches, since
// not every required fix changes the wire format. The *max* column is
// informational only (logged, never enforced): a newer peer is assumed
// forward-compatible unless proven otherwise. Bump the max on every
// EMLyUpdater/EMLy release, even one that doesn't touch this package; open
// a new row (with a fresh min) and freeze the previous row's max only when
// protocol_version itself is bumped for a wire-incompatible change.
//
//   protocol_version | EMLyUpdater min | EMLyUpdater max | EMLy min | EMLy max
//   -----------------+------------------+------------------+----------+----------
//   1 (frozen)       | 1.2.0b           | 1.2.0b           | 1.8.0    | 1.8.0
//   2                | 1.3.0            | 1.3.0            | 2.1.0    | 2.1.0

// ===== v1 (frozen legacy one-shot protocol) =====
//
// Everything below in this section is UNCHANGED and must stay wire-compatible
// with already-deployed EMLy builds older than 2.1.0. Do not edit these
// messages — add new ones in the v2 section instead. See internal/ipc's
// handleConn (server) / requestV2 (client, emly repo) for how a server built
// against protocol_version 2 still serves protocol_version 1 clients on the
// same pipe.

// Envelope is the single message written to and read from the pipe per
// exchange: one request Envelope in, one response Envelope out, then the
// connection closes.
message Envelope {
  uint32 protocol_version = 1;

  // Semver of the sending binary (EMLyUpdater on responses, EMLy on
  // requests) — never the wire protocol_version, which only tracks
  // schema/framing compatibility. Used by the receiving side to enforce
  // the min column of the compatibility matrix above.
  string sender_version = 2;

  oneof body {
    SystemInfoRequest system_info_request = 10;
    SystemInfoResponse system_info_response = 11;
    ADStatusRequest ad_status_request = 12;
    ADStatusResponse ad_status_response = 13;
    ErrorResponse error = 99;
  }
}

message SystemInfoRequest {}

message SystemInfoResponse {
  string hostname = 1;
  string hwid = 2;
  string internal_ip = 3;
  string os_version = 4;
}

message ADStatusRequest {}

message ADStatusResponse {
  string ad_domain = 1;
  bool domain_joined = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHORIZED = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_BAD_REQUEST = 3;
  ERROR_CODE_INTERNAL = 4;
}

message ErrorResponse {
  ErrorCode code = 1;
  // Generic only — never echoes a path or PID back to the client.
  string message = 2;
}

// ===== v2 (explicit handshake protocol) =====
//
// Every v2 message is written to the wire as
// [1-byte FrameType tag][4-byte big-endian length][protobuf bytes] — no
// Envelope/oneof wrapper. FRAME_TYPE_UNSPECIFIED (0) is RESERVED and must
// never be sent as a real tag: MaxFrameSize is 64KiB (65536), so a v1
// client's first wire byte — the most-significant byte of its 4-byte
// length prefix — is always 0x00 for any legacy-valid frame. A dual-protocol
// server therefore treats a first byte of 0x00 as unambiguously v1, and any
// other byte as a v2 FrameType tag. See emly-updater's internal/ipc/server.go
// handleConn and emly's backend/utils/updateripc/handshake.go requestV2.
//
// Exchange, one connection per session, in order:
//   ClientHello -> ServerAnswHello
//   ClientSemverSend -> ServerSemverOk | ServerSemverReject (closes on reject)
//   ServerRequestAuthChallenge -> ClientAuthResponse (closes on bad HMAC)
//   ClientSystemInfoRequest | ClientADStatusRequest
//     -> ServerSystemInfoResponse | ServerADStatusResponse | (wraps ErrorResponse)
//
// The payload phase deliberately reuses SystemInfoRequest/SystemInfoResponse
// and ADStatusRequest/ADStatusResponse above as-is (already independent
// top-level messages, never nested inside Envelope's oneof) — tagging them
// directly avoids duplicating identical message shapes.
enum FrameType {
  FRAME_TYPE_UNSPECIFIED = 0; // reserved — legacy-protocol discriminator, never a real message
  FRAME_TYPE_CLIENT_HELLO = 1;
  FRAME_TYPE_SERVER_ANSW_HELLO = 2;
  FRAME_TYPE_CLIENT_SEMVER_SEND = 3;
  FRAME_TYPE_SERVER_SEMVER_OK = 4;
  FRAME_TYPE_SERVER_SEMVER_REJECT = 5;
  FRAME_TYPE_SERVER_REQUEST_AUTH_CHALLENGE = 6;
  FRAME_TYPE_CLIENT_AUTH_RESPONSE = 7;
  FRAME_TYPE_CLIENT_SYSTEM_INFO_REQUEST = 8;
  FRAME_TYPE_SERVER_SYSTEM_INFO_RESPONSE = 9;
  FRAME_TYPE_CLIENT_AD_STATUS_REQUEST = 10;
  FRAME_TYPE_SERVER_AD_STATUS_RESPONSE = 11;
  FRAME_TYPE_SERVER_ERROR = 12; // wraps ErrorResponse; any v2 rejection after ClientHello
}

message ClientHello {
  uint32 protocol_version = 1; // must equal 2
}

message ServerAnswHello {
  uint32 protocol_version = 1; // echoed, always 2
  string server_version = 2; // EMLyUpdater's own semver
}

message ClientSemverSend {
  string client_version = 1; // EMLy's own semver
}

message ServerSemverOk {}

message ServerSemverReject {
  // Generic only — never echoes a path or PID back to the client.
  string reason = 1;
}

message ServerRequestAuthChallenge {
  bytes nonce = 1; // 32 random bytes, crypto/rand
}

message ClientAuthResponse {
  bytes hmac = 1; // HMAC-SHA256(sharedSecret, nonce)
}
