syntax = "proto3";

package emly.updateripc.v1;

// go_package is a placeholder: each repo generates into its own local
// package directory independently (paths=source_relative), so this does not
// need to resolve to a real cross-repo import path.
option go_package = "emlyipc/ipcpb;ipcpb";

// THIS FILE IS MANUALLY SYNCED between emly-updater/proto/updateripc.proto
// and emly/proto/updateripc.proto. There is no shared Go module between the
// two repos. Any change here MUST be copied verbatim to the other repo and
// both sides' generated code regenerated. Bump PROTOCOL_VERSION (a Go const
// in each repo, not a field in this file) on any wire-incompatible change.
//
// Compatibility matrix — which EMLyUpdater / EMLy releases speak which
// protocol_version. Both sides carry their own semver in sender_version
// (below) and enforce the *min* column of their own repo's compatibility
// consts (internal/ipc/version.go server-side, backend/utils/updateripc's
// version.go client-side) — a peer older than the min is rejected with
// ERROR_CODE_UNSUPPORTED_VERSION even when protocol_version matches, since
// not every required fix changes the wire format. The *max* column is
// informational only (logged, never enforced): a newer peer is assumed
// forward-compatible unless proven otherwise. Bump the max on every
// EMLyUpdater/EMLy release, even one that doesn't touch this package; open
// a new row (with a fresh min) and freeze the previous row's max only when
// protocol_version itself is bumped for a wire-incompatible change.
//
//   protocol_version | EMLyUpdater min | EMLyUpdater max | EMLy min | EMLy max
//   -----------------+------------------+------------------+----------+----------
//   1                | 1.2.0b           | 1.4.0            | 2.0.0    | 2.1.0

// Envelope is the single message written to and read from the pipe per
// exchange: one request Envelope in, one response Envelope out, then the
// connection closes.
message Envelope {
  uint32 protocol_version = 1;

  // Semver of the sending binary (EMLyUpdater on responses, EMLy on
  // requests) — never the wire protocol_version, which only tracks
  // schema/framing compatibility. Used by the receiving side to enforce
  // the min column of the compatibility matrix above.
  string sender_version = 2;

  oneof body {
    SystemInfoRequest system_info_request = 10;
    SystemInfoResponse system_info_response = 11;
    ADStatusRequest ad_status_request = 12;
    ADStatusResponse ad_status_response = 13;
    // Added in EMLyUpdater 1.6.0: the remote configuration document
    // (GET /v2/config) as the updater resolved it for this host. Additive,
    // so protocol_version stays 1 - an updater that predates it answers
    // ERROR_CODE_BAD_REQUEST and an EMLy that predates it never asks.
    ConfigRequest config_request = 14;
    ConfigResponse config_response = 15;
    ErrorResponse error = 99;
  }
}

message SystemInfoRequest {}

message SystemInfoResponse {
  string hostname = 1;
  string hwid = 2;
  string internal_ip = 3;
  string os_version = 4;
}

message ADStatusRequest {}

message ADStatusResponse {
  string ad_domain = 1;
  bool domain_joined = 2;
}

message ConfigRequest {}

// ConfigResponse hands EMLy the remote configuration document
// (GET /v2/config) as the updater sees it for this host: the global
// document with the matching overrides applied and expired `until`s
// resolved. Same JSON schema as the endpoint, so EMLy parses one format
// whether it comes from the pipe or, in a future fallback, from the API.
message ConfigResponse {
  bytes document_json = 1;
  int64 revision = 2;
  string generated_at = 3;   // from the document; "" for the default policy
  string fetched_at = 4;     // local clock, RFC 3339; "" for the default policy
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    REMOTE = 1;              // fetched (or revalidated) during this run
    CACHE = 2;               // last-known-good read from disk at startup
    DEFAULT = 3;             // derived from config.ini, no document ever accepted
  }
  Source source = 5;
  bool stale = 6;            // fetched_at older than refresh.staleAfterDays
  bool host_whitelisted = 7; // hostIntegrity.whitelist matched this host
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHORIZED = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_BAD_REQUEST = 3;
  ERROR_CODE_INTERNAL = 4;
}

message ErrorResponse {
  ErrorCode code = 1;
  // Generic only — never echoes a path or PID back to the client.
  string message = 2;
}
